# Runs only when a release tag is pushed: builds the package, publishes it to PyPI with trusted publishing (no stored token),
# and attaches the add-on zip to the GitHub release.
name: publish
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: Build the add-on zip
        run: |
          V="${GITHUB_REF_NAME#v}"
          PYTHONPATH=src python3 -c "from mifblender_mcp.setup_cli import build_addon_zip; build_addon_zip('MifBlender-$V.zip')"
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" MifBlender-*.zip --title "MifBlender ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md
