[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mifblender-mcp"
version = "1.3.1"
description = "AI in Blender through MCP: 428 typed tools that check their parameters and read the result back. Free, source available."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-MifBlender"
license-files = ["LICENSE.txt", "src/mifblender_mcp/mcp-server/LICENSE", "src/mifblender_mcp/blender-addon/MifBlender/LICENSE"]
authors = [{ name = "Mifsopo" }]
keywords = ["blender", "mcp", "ai", "3d", "modeling", "model-context-protocol", "claude"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = ["mcp>=1.2.0,<2"]

[project.scripts]
mifblender-mcp = "mifblender_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/mifsopo1/MifBlender"
Issues = "https://github.com/mifsopo1/MifBlender/issues"
Website = "https://mifshowcase.store/mifblender"

[tool.hatch.build.targets.wheel]
packages = ["src/mifblender_mcp"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "LICENSE.txt", "pyproject.toml"]
